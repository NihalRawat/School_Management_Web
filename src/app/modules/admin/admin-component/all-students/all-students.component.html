<div class="card-container" fxLayout="row" fxLayout.xs="column" fxLayoutGap="16px">
    <mat-card class="student-card" *ngFor="let student of students">
        <mat-card-header style="background-color: #3f51b5;">
            <mat-card-title style="color: white;">Name: {{student.name}}</mat-card-title> <mat-card-subtitle
                style="color: white;">Class:{{student.studentClass}}</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content style="margin-top: 10px;">
            <p>Email: {{student.email}}</p>
             <p>Father Name: {{student.fatherName}}</p>
                <p>Mother Name: {{student.motherName}}</p>
                <p>Date of Birth:{{student.dob | date:'MM-dd-YYYY'}} </p>
                <p>Gender: {{student.gender}}</p>
                <p>Address:{{student.address}} </p>
        </mat-card-content>
        <mat-card-actions>
            <button mat-button color="warn" routerLink="/admin/student/{{student.id}}">Update</button>
            <button mat-button color="warn" (click)="deleteStudent(student.id)">Delete</button>
        </mat-card-actions>
        </mat-card>
</div>
