<div class="card-container" fxLayout="row wrap" fxLayoutGap="16px" fxLayoutAlign="center">
    <mat-card class="student-card" *ngFor="let student of students">
      <mat-card-header class="card-header d-flex justify-content-between">
        <div class="avatar-container">
          <div class="avatar">
            <img mat-card-avatar src="assets/Images/schoolIcon.png" alt="student-avatar">
          </div>
        </div>
        <mat-card-title>{{student.name}}</mat-card-title>
        <mat-card-subtitle>Class: {{student.studentClass}}</mat-card-subtitle>
      </mat-card-header>
  
      <mat-card-content class="student-details">
        <p><strong>Email:</strong> {{student.email}}</p>
        <p><strong>Father's Name:</strong> {{student.fatherName}}</p>
        <p><strong>Mother's Name:</strong> {{student.motherName}}</p>
        <p><strong>Date of Birth:</strong> {{student.dob | date:'MM-dd-yyyy'}}</p>
        <p><strong>Gender:</strong> {{student.gender}}</p>
        <p><strong>Address:</strong> {{student.address}}</p>
      </mat-card-content>
  
      <mat-card-actions class="card-actions">
        <button mat-raised-button class="btn-edit" routerLink="/admin/fee/{{student.id}}">Fee Payment</button>
        <button mat-raised-button class="btn-update" routerLink="/admin/student/{{student.id}}">Update</button>
        <button mat-raised-button class="btn-delete" (click)="deleteStudent(student.id)">Delete</button>
      </mat-card-actions>
    </mat-card>
  </div>
